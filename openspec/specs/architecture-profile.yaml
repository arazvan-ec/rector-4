  design_patterns:
    - name: "chain-of-responsibility"
      location: "src/Orchestrator/"
      purpose: "Content type routing via OrchestratorChainHandler"
    - name: "strategy"
      location: "src/Application/DataTransformer/"
      purpose: "Body element transformation via tagged services"
    - name: "template-method"
      location: "src/Application/DataTransformer/Apps/Body/"
      purpose: "Inheritance hierarchy for body transformers"
    - name: "compiler-pass"
      location: "src/DependencyInjection/Compiler/"
      purpose: "Dynamic service registration (9 compilers: 7 original + EditorialResolverCompiler + EditorialPresenterCompiler)"
    - name: "anti-corruption-layer"
      location: "src/Application/DataTransformer/"
      purpose: "Isolate external service responses from domain"
    - name: "plugin-resolver"
      location: "src/Aggregator/Resolver/"
      purpose: "Pluggable resolver architecture via EditorialResolverInterface + priority ordering + compiler pass auto-registration"
    - name: "two-phase-async-resolution"
      location: "src/Aggregator/Resolver/MembershipPromiseInitiator.php, MembershipPromiseCollector.php"
      purpose: "Deferred async resolution: Initiator fires promise (priority 90), Collector awaits result (priority -10)"
    - name: "scratchpad-context"
      location: "src/Aggregator/Resolver/ResolverContext.php"
      purpose: "Shared mutable state bag passed between resolvers for inter-resolver communication"
    - name: "aggregator-presenter"
      location: "src/Aggregator/, src/Presenter/"
      purpose: "Two-layer architecture: Aggregator fetches → DTO → Presenter formats for consumer"

