# openspec/specs/architecture-profile.yaml
# Generated by /workflows:discover --setup on 2026-02-15
# Template: core/templates/architecture-profile-template.yaml

stack:
  language: "PHP 8.1+"
  framework: "Symfony 6.4"
  paradigm: "oop"
  type_system: "strong-dynamic"

architecture:
  pattern: "ddd"
  mandatory_pattern: "aggregator-presenter"
  mandatory_pattern_ref: "openspec/specs/architectural-constraints/aggregator-presenter-pattern.yaml"
  layers:
    - name: "controller"
      path: "snaapi-develop/src/Controller/"
      description: "HTTP entry points (thin controllers)"
      dependencies: ["orchestrator"]
    - name: "aggregator"
      path: "snaapi-develop/src/Aggregator/"
      description: "LAYER 1: Fetch and resolve external data → typed DTO (ResolvedEditorial)"
      dependencies: ["external-clients"]
      cannot_depend_on: ["presenter", "application"]
    - name: "presenter"
      path: "snaapi-develop/src/Presenter/"
      description: "LAYER 2: Translate DTO → format-specific array (apps, web, AMP, RSS...)"
      dependencies: ["aggregator-dto", "application"]
      cannot_depend_on: ["external-clients", "aggregator-service"]
    - name: "application"
      path: "snaapi-develop/src/Application/"
      description: "Data transformers (used by presenters)"
      dependencies: ["domain-models"]
    - name: "orchestrator"
      path: "snaapi-develop/src/Orchestrator/"
      description: "Thin coordinator: aggregator.aggregate() → presenter.present()"
      dependencies: ["aggregator", "presenter"]
    - name: "infrastructure"
      path: "snaapi-develop/src/Infrastructure/"
      description: "Enums, services (Thumbor, PictureShots), traits"
      dependencies: []
    - name: "dependency-injection"
      path: "snaapi-develop/src/DependencyInjection/"
      description: "Compiler passes for dynamic service registration"
      dependencies: ["framework"]
    - name: "external-clients"
      path: "vendor/ec/*"
      description: "Bounded context clients (Editorial, Multimedia, Journalist, etc.)"
      dependencies: []
  separation_enforced: true

patterns_detected:
  data_access: "http-client-external"
  dependency_management: "constructor-injection-autowire"
  error_handling: "exceptions-mixed"
  async_pattern: "guzzle-promises"
  testing_approach: "test-after"
  design_patterns:
    - name: "chain-of-responsibility"
      location: "src/Orchestrator/"
      purpose: "Content type routing via OrchestratorChainHandler"
    - name: "strategy"
      location: "src/Application/DataTransformer/"
      purpose: "Body element transformation via tagged services"
    - name: "template-method"
      location: "src/Application/DataTransformer/Apps/Body/"
      purpose: "Inheritance hierarchy for body transformers"
    - name: "compiler-pass"
      location: "src/DependencyInjection/Compiler/"
      purpose: "Dynamic service registration (7 compilers)"
    - name: "anti-corruption-layer"
      location: "src/Application/DataTransformer/"
      purpose: "Isolate external service responses from domain"

solid_relevance:
  srp:
    relevance: "high"
    metric: "classes ≤200 LOC, ≤7 public methods"
    when_violated: "Extract Class, then compose"
    reference_good: "snaapi-develop/src/Application/DataTransformer/Apps/Body/ParagraphDataTransformer.php"
    violations:
      - file: "snaapi-develop/src/Orchestrator/Chain/EditorialOrchestrator.php"
        loc: 536
        constructor_deps: 19
        issue: "God class: fetching, transformation, orchestration, promise resolution"
  ocp:
    relevance: "high"
    metric: "no switch/if-else chains by type"
    when_violated: "Strategy pattern via tagged services"
    reference_good: "snaapi-develop/src/Application/DataTransformer/BodyElementDataTransformerHandler.php"
  lsp:
    relevance: "medium"
    metric: "overrides respect parent contract"
    when_violated: "Composition over Inheritance"
    concern: "4-level inheritance in body transformers"
  isp:
    relevance: "high"
    metric: "interfaces ≤5 methods"
    reference_good: "snaapi-develop/src/Orchestrator/Chain/EditorialOrchestratorInterface.php"
  dip:
    relevance: "high"
    metric: "Depend on interfaces, not concrete classes"
    when_violated: "Extract interface, inject abstraction"
    reference_good: "snaapi-develop/src/Orchestrator/OrchestratorChain.php"

resilience_strategy:
  pattern: "circuit-breaker-per-service"
  spec_ref: "openspec/specs/architectural-constraints/resilience-strategy.yaml"
  description: |
    Each Aggregator sub-service implements degradation based on service criticality.
    CRITICAL services (editorial) fail the request. LOW services (multimedia, section,
    journalist, tag, membership) degrade gracefully with null/empty and logged warnings.
  critical_services: ["editorial-client"]
  low_services: ["multimedia-client", "section-client", "journalist-client", "tag-client", "membership-client", "widget-client"]

cache_strategy:
  pattern: "hybrid-3-level"
  spec_ref: "openspec/specs/architectural-constraints/cache-strategy.yaml"
  description: |
    Level 1: Varnish/CDN (existing). Level 2: httplug + Couchbase (transparent HTTP cache
    for all external client calls). Level 3: Circuit breaker fallback (degradation when
    httplug has no cache AND service is down).
  invalidation: "reactive-amqp"
  invalidation_description: |
    Microservices publish AMQP events on content change. SNAAPI Messenger consumers
    invalidate httplug Couchbase keys and send Varnish BAN requests.
  existing_infrastructure: ["symfony-messenger", "amqp-rabbitmq", "PurgeEditorialHandler"]

conventions:
  naming:
    classes: "PascalCase"
    methods: "camelCase"
    files: "match-class-name"
  structure:
    controllers: "src/Controller/V1/"
    aggregators: "src/Aggregator/"
    aggregator_dtos: "src/Aggregator/DTO/"
    aggregator_services: "src/Aggregator/Service/"
    presenters: "src/Presenter/"
    presenter_apps: "src/Presenter/Apps/"
    transformers: "src/Application/DataTransformer/"
    orchestrators: "src/Orchestrator/"
    infrastructure: "src/Infrastructure/"
    compilers: "src/DependencyInjection/Compiler/"
  reference_files:
    controller: "snaapi-develop/src/Controller/V1/EditorialController.php"
    aggregator: "snaapi-develop/src/Aggregator/EditorialAggregator.php"
    aggregator_dto: "snaapi-develop/src/Aggregator/DTO/ResolvedEditorial.php"
    presenter: "snaapi-develop/src/Presenter/Apps/AppsEditorialPresenter.php"
    orchestrator: "snaapi-develop/src/Orchestrator/Chain/EditorialOrchestrator.php"
    transformer: "snaapi-develop/src/Application/DataTransformer/Apps/Body/ParagraphDataTransformer.php"
    compiler: "snaapi-develop/src/DependencyInjection/Compiler/BodyDataTransformerCompiler.php"
    test: "snaapi-develop/tests/Orchestrator/Chain/EditorialOrchestratorTest.php"

quality_thresholds:
  max_class_loc: 200
  max_public_methods: 7
  max_constructor_deps: 7
  max_interface_methods: 5
  max_files_per_simple_change: 5
