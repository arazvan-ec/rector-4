# Business Rules: Editorial Aggregation
# Extracted by /workflows:discover on 2026-02-15
# Refreshed by /workflows:discover --refresh on 2026-02-16

business_rules:
  domain_area: "editorial-aggregation"
  description: "Rules governing how editorial content is fetched, aggregated, and transformed via the plugin-based resolver architecture"

  rules:
    - id: "BR-EDIT-001"
      name: "Visibility Gate"
      description: "Only published/visible editorials are returned to clients"
      type: "constraint"
      condition:
        when: "Editorial is requested by ID"
        given: "Editorial exists in editorial service"
        then: "Return editorial only if isVisible() is true, else throw EditorialNotPublishedYetException"
      implementation:
        location: "snaapi-develop/src/Aggregator/EditorialAggregator.php"
        method: "aggregate"
        pattern: "guard-clause"
      priority: "critical"

    - id: "BR-EDIT-002"
      name: "Legacy Fallback"
      description: "If editorial has no sourceEditorial, delegate to legacy client"
      type: "workflow"
      condition:
        when: "Editorial.sourceEditorial() is null"
        given: "Editorial fetched from editorial service"
        then: "Redirect to QueryLegacyClient.findEditorialById()"
      implementation:
        location: "snaapi-develop/src/Orchestrator/Chain/EditorialOrchestrator.php"
        method: "execute"
        pattern: "early-return"
      priority: "critical"

    - id: "BR-EDIT-003"
      name: "Inserted News Aggregation"
      description: "Body elements of type BodyTagInsertedNews are enriched with full editorial data"
      type: "calculation"
      condition:
        when: "Body contains BodyTagInsertedNews elements"
        given: "Each inserted news has an editorialId"
        then: "Fetch editorial, section, signatures, and multimedia for each inserted news"
      implementation:
        location: "snaapi-develop/src/Aggregator/Resolver/InsertedNewsResolverAdapter.php"
        method: "resolve"
        delegates_to: "snaapi-develop/src/Aggregator/Service/InsertedNewsResolver.php"
        pattern: "adapter-delegation"
      exceptions:
        - "Invisible inserted editorials are silently skipped"
      priority: "high"

    - id: "BR-EDIT-004"
      name: "Recommended Editorials Aggregation"
      description: "Recommended editorials are enriched with full data, failures are silently skipped"
      type: "calculation"
      condition:
        when: "Editorial has recommended editorials"
        given: "List of EditorialId references"
        then: "Fetch and aggregate each, catch and log errors, continue on failure"
      implementation:
        location: "snaapi-develop/src/Aggregator/Resolver/RecommendedEditorialsResolverAdapter.php"
        method: "resolve"
        delegates_to: "snaapi-develop/src/Aggregator/Service/RecommendedEditorialsResolver.php"
        pattern: "adapter-delegation"
      exceptions:
        - "Any Throwable is caught, logged, and skipped"
      priority: "high"

    - id: "BR-EDIT-005"
      name: "Multimedia Async Resolution"
      description: "Multimedia data is fetched asynchronously via Guzzle promises and settled before use"
      type: "workflow"
      condition:
        when: "Editorial or sub-editorials have multimedia"
        given: "Multimedia is not a Widget type"
        then: "Fetch async via promises, settle with Utils::settle(), filter fulfilled results"
      implementation:
        location: "snaapi-develop/src/Aggregator/Resolver/MultimediaResolverAdapter.php"
        method: "resolve"
        delegates_to: "snaapi-develop/src/Aggregator/Service/MultimediaResolver.php"
        pattern: "promise-aggregation"
      priority: "medium"

    - id: "BR-EDIT-006"
      name: "Parallel Tag Resolution"
      description: "Tags are fetched in parallel using Guzzle promises instead of sequential HTTP calls"
      type: "workflow"
      condition:
        when: "Editorial has tags"
        given: "Each tag has an ID in the editorial's tag collection"
        then: "Launch N async findTagById() promises, settle all with Utils::settle(), collect fulfilled results"
      implementation:
        location: "snaapi-develop/src/Aggregator/Resolver/TagResolver.php"
        method: "resolve"
        pattern: "parallel-promise-aggregation"
      priority: "medium"

    - id: "BR-EDIT-007"
      name: "Two-Phase Membership Resolution"
      description: "Membership links are resolved via a two-phase async pattern to minimize latency"
      type: "workflow"
      condition:
        when: "Editorial needs membership links"
        given: "Section is resolved (needed to determine site)"
        then: "Phase 1 (priority 90): MembershipPromiseInitiator fires async HTTP promise. Phase 2 (priority -10): MembershipPromiseCollector awaits the promise and collects result"
      implementation:
        location: "snaapi-develop/src/Aggregator/Resolver/MembershipPromiseInitiator.php, MembershipPromiseCollector.php"
        method: "resolve"
        pattern: "two-phase-async-via-context"
        context_key: "membership_promise"
      priority: "medium"

  cross_cutting_rules:
    - id: "BR-CROSS-001"
      name: "Signature Resolution"
      description: "Journalist signatures are resolved via alias ID across all editorial types"
      affected_areas: ["editorial-detail", "inserted-news", "recommended-editorials"]
      implementation:
        location: "snaapi-develop/src/Aggregator/Resolver/SignatureResolverAdapter.php"
        method: "resolve"
        delegates_to: "snaapi-develop/src/Aggregator/Service/SignatureResolver.php"

    - id: "BR-CROSS-002"
      name: "Resolver Priority Ordering"
      description: "All resolvers execute in priority order (highest first), enabling dependency sequencing"
      affected_areas: ["all-resolvers"]
      implementation:
        location: "snaapi-develop/src/Aggregator/EditorialAggregator.php"
        method: "aggregate"
        enforced_by: "snaapi-develop/src/DependencyInjection/Compiler/EditorialResolverCompiler.php"

  source_files:
    - "snaapi-develop/src/Orchestrator/Chain/EditorialOrchestrator.php"
    - "snaapi-develop/src/Aggregator/EditorialAggregator.php"
    - "snaapi-develop/src/Aggregator/Resolver/"
    - "snaapi-develop/src/Aggregator/Service/"
    - "snaapi-develop/src/Exception/EditorialNotPublishedYetException.php"

  extracted_at: "2026-02-16T12:00:00Z"
